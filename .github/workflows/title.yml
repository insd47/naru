name: Title

# Pull requests are squashed, so the title becomes the commit on main and a line of CHANGELOG.md.
on:
  pull_request_target:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          # A change to one app only names it, so its store gets the change in the release notes.
          scopes: |
            ipad
            android
            windows
          requireScope: false
          subjectPattern: ^[a-z0-9][ -~]*$
          subjectPatternError: The subject "{subject}" goes into CHANGELOG.md as is, so write it in English (ASCII), lowercase and imperative.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
