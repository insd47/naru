name: Check

# The core's checks from CONTRIBUTING.md, and a build of each app against it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  android:
    runs-on: ubuntu-latest

    steps:
      # The version code is the commit count.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          rustup target add aarch64-linux-android
          ./gradlew --no-daemon :app:assembleDebug

  ipad:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad

      - name: Build
        run: |
          rustup target add aarch64-apple-ios
          xcodebuild -project ios/Naru.xcodeproj -scheme Naru -configuration Release \
            -destination generic/platform=iOS -derivedDataPath ios/build/dd CODE_SIGNING_ALLOWED=NO build

  windows:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # Built from git, so it is kept between runs.
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-v0.11.1+v0.31.0

      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.1+v0.31.0

      - name: Build
        working-directory: windows/Naru
        run: dotnet build -c Release -p:Platform=x64 -nologo
