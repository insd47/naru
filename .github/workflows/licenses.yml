name: Licenses

# The core's third-party notices are committed. This fails when Cargo.lock changed without regenerating them, or when
# a dependency brings a license the project has not accepted.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  notices:
    name: notices
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate notices
        run: |
          cargo fetch --locked
          cargo about generate --frozen --fail licenses/text.hbs -o licenses/notices/core.txt
          cargo about generate --frozen --fail licenses/plist.hbs -o ios/Naru/Settings.bundle/Acknowledgements.plist

      - name: Check notices
        run: git diff --exit-code
