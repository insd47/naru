name: iPad

# Archives the iPad app at a tag and uploads it to TestFlight. Signing is cloud-managed through the App Store Connect
# API key, so no certificate goes into the runner's keychain.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.0
        required: true

jobs:
  testflight:
    name: TestFlight
    runs-on: xcode-27

    steps:
      # The build number is the commit count.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        run: rustup target add aarch64-apple-ios

      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: printf '%s' "$KEY" > "$RUNNER_TEMP/key.p8"

      - name: Archive
        run: >
          xcodebuild -project ios/Naru.xcodeproj -scheme Naru -configuration Release -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/Naru.xcarchive" -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/key.p8"
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          archive

      - name: Write the export options
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>9C733G7JPX</string>
          </dict>
          </plist>
          PLIST

      - name: Upload to TestFlight
        run: >
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Naru.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/key.p8"
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
