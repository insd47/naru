[workspace]
# Naru is not on crates.io, so the current version comes from the git tags.
git_only = true
release_always = false
release_commits = "^(feat|fix|perf|revert)|^[a-z]+(\\(.+\\))?!:"
pr_labels = ["release"]

# The apps share the core's version, so every commit counts, ios/, android/, and windows/ included.
[[package]]
name = "naru"
publish = false
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
# The APK is for devices without Google Play. Google Play re-signs its copies with the app signing key.
git_release_body = """
{{ changelog }}

The APK installs on devices without Google Play. It is signed with a different key from the app on Google Play, so one does not update the other.
"""

[changelog]
# A release lists the changes to every app first, then each app's own, by the commit's scope (ipad, android, windows).
# The release workflow sends the store of each app its part.
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for platform in ["", "ipad", "android", "windows"] -%}
{% set_global scoped = [] -%}
{% for commit in commits -%}
{% if commit.scope | default(value="") == platform %}{% set_global scoped = scoped | concat(with=commit) %}{% endif -%}
{% endfor -%}
{% if scoped | length > 0 %}
### {% if platform == "ipad" %}iPad{% elif platform == "android" %}Android{% elif platform == "windows" %}Windows{% else %}All{% endif %}
{% for group, grouped in scoped | group_by(attribute="group") %}
#### {{ group | upper_first }}
{% for commit in grouped -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endfor -%}
{% endfor -%}
{% endif -%}
{% endfor %}
"""
protect_breaking_commits = true
commit_parsers = [
    { message = "^[a-z]+(\\(.+\\))?!:", group = "changed" },
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^(perf|revert)", group = "changed" },
    { message = ".*", skip = true },
]
