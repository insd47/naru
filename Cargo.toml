[package]
name = "naru"
description = "Core and UniFFI boundary of a client for macOS Screen Sharing's High Performance mode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Android loads the cdylib, and the iOS app links the staticlib.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
aes.workspace = true
cbc.workspace = true
ctr.workspace = true
flate2.workspace = true
hmac.workspace = true
num-bigint-dig.workspace = true
pbkdf2.workspace = true
plist.workspace = true
prost.workspace = true
rand.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
uniffi.workspace = true

[dev-dependencies]
anyhow.workspace = true
rpassword.workspace = true
tokio = { workspace = true, features = ["signal"] }
# Only the binding generator (`examples/uniffi-bindgen.rs`) uses this, so it stays out of the library build.
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Crypto crates stay on the same RustCrypto generation as `rsa` 0.9; mixing generations makes their traits incompatible.
[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.98"
cbc = "0.1.2"
ctr = "0.9.2"
flate2 = "1.1.10"
hmac = "0.12.1"
num-bigint-dig = "0.8.6"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
plist = "1.10.1"
prost = "0.14.4"
rand = "0.8.5"
rpassword = "7.5.4"
rsa = "0.9.10"
sha1 = "0.10.7"
sha2 = "0.10.9"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "io-util", "rt", "sync", "time"] }
# Pinned because the generated code and the runtime must match. Check the changelog when bumping.
# Held at 0.31.0 for the Windows app: uniffi-bindgen-cs supports nothing newer. 0.31.1 through 0.32.0 break Kotlin's
# checksum check on aarch64.
uniffi = "=0.31.0"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
self_named_module_files = "warn"
redundant_pub_crate = "warn"

# Crypto is tens of times slower in debug builds. The server's PBKDF2 runs over a hundred thousand iterations and SRTP
# decrypts the whole video stream, so dependencies are optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 3
