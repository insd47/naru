[package]
name = "naru"
description = "macOS 화면 공유 High Performance 모드 클라이언트의 코어와 UniFFI 경계"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Android는 cdylib를 읽어 들입니다.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
aes.workspace = true
cbc.workspace = true
ctr.workspace = true
flate2.workspace = true
hmac.workspace = true
num-bigint-dig.workspace = true
pbkdf2.workspace = true
plist.workspace = true
prost.workspace = true
rand.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
uniffi.workspace = true

[dev-dependencies]
anyhow.workspace = true
rpassword.workspace = true
tokio = { workspace = true, features = ["signal"] }
# 바인딩 생성기(`examples/uniffi-bindgen.rs`)에만 쓰므로 라이브러리 빌드에는 들어가지 않습니다.
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# 암호 크레이트는 `rsa` 0.9와 같은 RustCrypto 세대로 맞춥니다. 세대가 섞이면 trait이 호환되지 않습니다.
[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.98"
cbc = "0.1.2"
ctr = "0.9.2"
flate2 = "1.1.10"
hmac = "0.12.1"
num-bigint-dig = "0.8.6"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
plist = "1.10.1"
prost = "0.14.4"
rand = "0.8.5"
rpassword = "7.5.4"
rsa = "0.9.10"
sha1 = "0.10.7"
sha2 = "0.10.9"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "io-util", "rt", "sync", "time"] }
# 생성 코드와 런타임이 같은 버전이어야 하므로 고정합니다. 올릴 때 변경 내역을 확인합니다.
uniffi = "=0.32.2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
self_named_module_files = "warn"
redundant_pub_crate = "warn"

# 암호 연산은 debug 빌드에서 수십 배 느려집니다. 서버의 PBKDF2 반복은 십수만 번이고 SRTP는 영상 전체를 풀어야 하므로,
# dev 빌드에서도 의존성은 최적화합니다.
[profile.dev.package."*"]
opt-level = 3
