# Licenses the core's dependencies may use, in the order a dual-licensed crate's license is chosen.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

# Only what is linked into the apps: no tests, examples, or build tools.
ignore-dev-dependencies = true
ignore-build-dependencies = true
